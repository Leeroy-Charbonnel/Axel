<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- In production Express replaces the title and the description with the page's own, see server/site.ts -->
    <meta name="description" content="Portfolio of Axel Offret, 3D artist." />
    <title>Axel Offret - 3D Artist</title>
    <style>
      /* the server-rendered content inside #app, shown until Vue mounts over it */
      .seo-snapshot {
        max-width: var(--vsui-page-width);
        margin: 0 auto;
        padding: var(--vsui-space-xl) var(--vsui-space-md);
        color: var(--text-main);
        font-size: var(--vsui-text-base);
      }
      .seo-snapshot a { color: inherit; }
      .seo-snapshot img { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
